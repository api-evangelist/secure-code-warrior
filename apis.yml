- aid: secure-code-warrior:secure-code-warrior-direct-linking-api
  name: Secure Code Warrior Direct Linking API
  tags:
  - Security Training
  - Application Security
  - CWE
  - OWASP
  - GitHub Integration
  humanURL: >-
    https://help.securecodewarrior.com/hc/en-us/articles/900005309583-Direct-Linking-API-Documentation
  properties:
  - url: >-
      https://help.securecodewarrior.com/hc/en-us/articles/900005309583-Direct-Linking-API-Documentation
    type: Documentation
  description: >-
    The Secure Code Warrior Direct Linking API is a RESTful JSON service that allows partners to retrieve
    application security training material including links to explainer videos and training exercises
    in over 50 programming languages and frameworks. The API maps Common Weakness Enumeration (CWE) and
    OWASP vulnerability references to contextually relevant training content, enabling integration with
    GitHub, SARIF code scanning alerts, and other developer workflow tools.
